# 推送 v* 版本 tag 自动构建并发布 Docker 镜像到 GitHub Container Registry(ghcr.io)。
# 发版流程(详见 docs/release.md):
#   1. 对齐 app/__init__.py 的 __version__(下方校验步骤会核对,不一致直接失败)
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# 镜像 tag 规则:vX.Y.Z → X.Y.Z / X.Y / latest
# 手动 workflow_dispatch:选已有 tag 可补跑发布;选分支则只构建自检、不推送。
name: Release Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 校验 tag 与代码版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          if [ -z "$CODE" ]; then
            echo "::error::无法从 app/__init__.py 解析出 __version__"
            exit 1
          fi
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::tag v$TAG 与 app/__init__.py __version__=$CODE 不一致,请先对齐再打 tag"
            exit 1
          fi

      # ghcr 镜像名必须全小写(仓库 owner 是 RavenHogWarts)
      - name: 计算镜像名(转小写)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # arm64 交叉构建
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像 tag/label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 分支上手动触发时 meta 解析不出 tag → 只构建自检,不推送
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # runner 在海外,覆盖 Dockerfile 的国内源默认值(官方 python 基础镜像 +
          # 官方 PyPI)更稳;本地构建不受影响
          build-args: |
            BASE_IMAGE=python:3.12-slim
            PIP_INDEX_URL=
